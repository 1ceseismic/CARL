name: Build and release

# One-time setup: configure the carl-gpu runner below, a protected pypi
# environment, and PyPI trusted publishing for this repository and release.yml.
# Confirm ownership of the PyPI package name before publishing.
# v<project.version> tags run tests and publish only after they pass.
# Wheel builds, GPU testing, and publishing still need end-to-end validation.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on:   ubuntu-22.04
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    env:
      CUDA_HOME:               /usr/local/cuda
      CARL_CUDA_ARCHITECTURES: "75-real;80-real;86-real;89-real;90"
      CC:                      gcc-12
      CXX:                     g++-12
      CUDAHOSTCXX:             g++-12
    steps:
      - name: Install host tools
        run:  |
          apt-get update
          apt-get install -y --no-install-recommends gcc-12 g++-12 git curl ca-certificates patchelf
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging tools
        run:  python -m pip install uv auditwheel setuptools
      - name: Test build configuration
        run:  python -m unittest discover -s tests -p 'test_build.py'
      - name: Check release version
        if:   startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}", "Tag must match package version"
          PY
      - name: Build wheel from source distribution
        run:  |
          uv build --sdist
          uv build dist/*.tar.gz --wheel --out-dir wheelhouse
      - name: Inspect and repair wheel
        run:  |
          auditwheel show wheelhouse/*.whl
          auditwheel repair --plat manylinux_2_35_x86_64 --wheel-dir dist wheelhouse/*.whl
          auditwheel show dist/*.whl
      - name: Check distribution contents
        run:  python tools/check_dist.py dist
      - uses: actions/upload-artifact@v4
        with:
          name:              distributions
          path:              dist/
          if-no-files-found: error

  # Configure a dedicated trusted runner with Python 3.11, uv and an NVIDIA
  # driver >=570.26 (or newer if required by Torch), but no system CUDA toolkit.
  # Do not run untrusted pull-request code on this runner.
  gpu-test:
    needs:   build
    runs-on: [self-hosted, linux, x64, carl-gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name:  Test installed wheel outside checkout
        shell: bash
        run:   |
          test_env=$(mktemp -d "$RUNNER_TEMP/carl-wheel-test.XXXXXX")
          uv venv --python 3.11 "$test_env"
          uv pip install --python "$test_env/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$test_env/bin/python" "$GITHUB_WORKSPACE/tests/test_gpu.py"

  publish:
    if:          startsWith(github.ref, 'refs/tags/')
    needs:       [build, gpu-test]
    runs-on:     ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Mirror distributions to GitHub Release
        env:
          GH_TOKEN:    ${{ github.token }}
          GH_REPO:     ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG"; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
